{% extends "templates/web.html" %}

{% block title %}AIKO Assistant{% endblock %}

{% block favicon %}
<link rel="icon" type="image/svg+xml" href="/assets/frappe_assistant_core/images/aiko-icon.svg">
{% endblock %}

{% block head %}
<style>
    .navbar, .web-footer, footer.web-footer, nav.navbar,
    .page-header, .container.page-header, .web-sidebar {
        display: none !important;
    }
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100% !important;
        overflow: hidden !important;
    }
    .page_content, .container, .page-content-wrapper, main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        width: 100% !important;
    }
    #aiko-web-root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }
</style>
{% endblock %}

{% block page_content %}
<div id="aiko-web-root"></div>
{% endblock %}

{% block script %}
<script type="module" src="/assets/frappe_assistant_core/premium-ai-widget/dist/js/fullpage.js"></script>
<script>
    frappe.ready(function () {
        if (window.AikoChatPage) {
            AikoChatPage.init(document.getElementById('aiko-web-root'));
        } else {
            document.getElementById('aiko-web-root').innerHTML =
                "<h3 style='padding:20px;color:red;'>Error: AikoChatPage failed to load.</h3>";
        }
    });
</script>
{% endblock %}
